<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OH! Barcode</title>
    <style>
      :root{
        --ozkiz-orange:#e5152c;
        --ozkiz-orange-light:#ff3b50;
        --ozkiz-orange-dark:#a80d1f;
        --ozkiz-pink:#c81e3a;
        --ozkiz-pink-soft:#fdeceb;
        --ozkiz-bg:#fbfbfc;
        --ozkiz-card:#ffffff;
        --ozkiz-line:#e9e6e7;
        --ozkiz-text:#1a1a1a;
        --ozkiz-muted:#7a7478;
      }
      * { box-sizing:border-box; }
      body { margin:0; font-family:'Segoe UI','Apple SD Gothic Neo',sans-serif; background:var(--ozkiz-bg); color:var(--ozkiz-text); }
      .card { background:var(--ozkiz-card); border:1px solid var(--ozkiz-line); border-radius:20px; padding:20px; margin-bottom:16px; box-shadow:0 10px 28px rgba(180,20,35,0.06), 0 2px 6px rgba(0,0,0,0.03); }

      .app-shell{display:flex; align-items:flex-start; min-height:100vh;}
      .sidebar{
        width:320px; flex-shrink:0; min-height:100vh; position:sticky; top:0;
        background:var(--ozkiz-card); border-right:1px solid var(--ozkiz-line);
        padding:28px 20px; display:flex; flex-direction:column; box-sizing:border-box;
      }
      .sidebar-brand h1{ font-size:20px; font-weight:800; margin:0 0 8px; color:#111; letter-spacing:-0.5px; white-space:nowrap; }
      .sidebar-brand h1 .brand-mark{ color:var(--ozkiz-orange); font-weight:800; font-size:1em; }
      .sidebar-brand > span{ font-size:13px; color:var(--ozkiz-muted); line-height:1.5; display:block; }
      .sidebar-spacer{flex:1;}
      .sidebar-bottom{display:flex; flex-direction:column; gap:8px; margin-top:24px;}
      .view-toggle{display:flex; flex-direction:column; gap:6px; flex-shrink:0;}
      .side-link{
        display:flex; align-items:center; gap:6px;
        background:#fff; border:1px solid var(--ozkiz-line); border-radius:12px;
        padding:10px 14px; font-size:13px; font-weight:700; color:var(--ozkiz-text);
        text-decoration:none; box-shadow:0 2px 8px rgba(0,0,0,0.05);
      }
      .side-link:hover{border-color:var(--ozkiz-orange);}
      .side-link-mark{color:var(--ozkiz-orange); font-weight:800;}

      .app-main{flex:1; min-width:0; max-width:1500px; padding:32px 40px; box-sizing:border-box;}

      body.force-mobile .app-shell{flex-direction:column;}
      body.force-mobile .sidebar{width:100%; min-height:auto; position:static; border-right:none; border-bottom:1px solid var(--ozkiz-line); padding:16px;}
      body.force-mobile .sidebar-spacer{display:none;}
      body.force-mobile .sidebar-bottom{margin-top:14px;}
      body.force-mobile .sidebar-bottom .side-link{display:none;}
      body.force-mobile .app-main{padding:16px; max-width:100%;}
      .view-btn{width:100%; padding:9px 16px; font-size:13px; border-radius:999px; background:#fff; color:var(--ozkiz-orange); border:1.5px solid var(--ozkiz-orange); white-space:nowrap;}
      .view-btn:hover{background:var(--ozkiz-pink-soft);}
      .view-btn.active{background:var(--ozkiz-orange); color:#fff; border-color:var(--ozkiz-orange);}
      .view-btn.active:hover{background:var(--ozkiz-orange-dark); border-color:var(--ozkiz-orange-dark);}
      h1,h2{margin-top:0; color:var(--ozkiz-text);}
      h2{font-size:16px; color:var(--ozkiz-text);}
      .grid{
        display:grid; gap:16px;
        grid-template-columns:1.8fr 1fr;
        grid-template-areas:"search queue" "log queue";
      }
      .grid .search-card{grid-area:search; min-width:0;}
      .grid .log-card{grid-area:log; min-width:0;}
      .grid .queue-card{grid-area:queue; min-width:0;}
      .grid .card{margin-bottom:0;}
      label{display:block; margin-bottom:8px; font-weight:600; color:var(--ozkiz-text);}
      input, textarea, select, button{width:100%; padding:10px; border-radius:12px; border:1px solid var(--ozkiz-line); font-size:14px; font-family:inherit;}
      input, select{background:#fff; color:var(--ozkiz-text); transition:border-color .15s ease, box-shadow .15s ease;}
      input:focus, select:focus{outline:none; border-color:var(--ozkiz-orange); box-shadow:0 0 0 3px rgba(229,21,44,0.12);}
      input[type="checkbox"]{width:16px; height:16px; padding:0; flex:0 0 16px; accent-color:var(--ozkiz-orange); cursor:pointer;}
      button{
        cursor:pointer; color:white; font-weight:700; border:none; border-radius:12px;
        background:var(--ozkiz-orange);
        transition:background .15s ease, transform .05s ease;
      }
      button:hover{background:var(--ozkiz-orange-dark);}
      button:active{transform:scale(0.98);}
      button.secondary{background:var(--ozkiz-orange);}
      button.secondary:hover{background:var(--ozkiz-orange-dark);}
      button.ghost{background:var(--ozkiz-orange);}
      button.ghost:hover{background:var(--ozkiz-orange-dark);}
      .row{display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap;}
      .row h2{flex-shrink:0; white-space:nowrap;}
      #productResults{max-height:520px; min-height:240px; overflow-y:auto; min-width:0;}
      #jobList{max-height:520px; min-height:240px; overflow-y:auto; min-width:0;}
      #logList{max-height:360px; min-height:240px; overflow-y:auto; min-width:0;}
      .queue-card{display:flex; flex-direction:column;}
      .queue-card #jobList{flex:1; min-height:240px; max-height:640px;}
      .small{font-size:12px; color:var(--ozkiz-muted);}
      .table-wrap{overflow-x:auto;}
      .data-table{width:100%; border-collapse:collapse; font-size:12px;}
      .data-table th{text-align:left; font-weight:600; color:var(--ozkiz-muted); font-size:11px; padding:6px 8px; border-bottom:1px solid var(--ozkiz-line); white-space:nowrap;}
      .data-table{table-layout:auto;}
      .data-table td{padding:5px 6px; border-bottom:1px solid var(--ozkiz-line); vertical-align:middle; white-space:nowrap;}
      .data-table td.wrap{white-space:normal; max-width:175px;}
      .data-table tr:last-child td{border-bottom:none;}
      .data-table td.nowrap{white-space:nowrap;}
      .data-table .name-cell{font-weight:700; color:var(--ozkiz-text);}
      .job-status{display:inline-block; padding:2px 8px; font-size:10px; font-weight:700; border-radius:999px; background:var(--ozkiz-pink-soft); color:var(--ozkiz-orange-dark); white-space:nowrap;}
      .row-actions{display:flex; gap:6px; align-items:center;}
      .row-actions button{width:auto; padding:4px 8px; font-size:10.5px; white-space:nowrap;}
      .qty-row{display:flex; align-items:center; gap:3px;}
      .qty-btn{width:20px; height:20px; flex:0 0 20px; padding:0; border-radius:6px; font-size:12px; font-weight:800; line-height:1; background:var(--ozkiz-orange); color:#fff;}
      .qty-btn:hover{background:var(--ozkiz-orange-dark);}
      .qty-input{width:30px; flex:0 0 30px; padding:2px; text-align:center; font-weight:700; font-size:11px;}
      .log-toolbar, .search-toolbar, .queue-toolbar{display:flex; gap:8px; flex-shrink:0; align-items:center; flex-wrap:wrap;}
      .log-toolbar button, .search-toolbar button, .queue-toolbar button{width:auto; padding:7px 14px; font-size:13px; white-space:nowrap;}
      .log-toolbar input[type="date"]{width:auto; padding:6px 10px; font-size:13px;}
      .search-toolbar input{width:220px; max-width:100%;}
      .data-table th.checkbox-col, .data-table td.checkbox-col{width:1%;}
      @keyframes rowFadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
      #productResults tbody tr{ animation:rowFadeIn .32s ease both; }
      @media (prefers-reduced-motion:reduce){ #productResults tbody tr{ animation:none; } }
      .fly-dot{ position:fixed; z-index:9999; width:14px; height:14px; border-radius:999px; background:var(--ozkiz-orange); box-shadow:0 4px 10px rgba(229,21,44,0.4); pointer-events:none; }
      @keyframes queuePulse{
        0%{ box-shadow:0 10px 28px rgba(180,20,35,0.06), 0 2px 6px rgba(0,0,0,0.03); }
        40%{ box-shadow:0 0 0 4px rgba(229,21,44,0.22), 0 10px 28px rgba(180,20,35,0.06); }
        100%{ box-shadow:0 10px 28px rgba(180,20,35,0.06), 0 2px 6px rgba(0,0,0,0.03); }
      }
      .queue-card.pulse{ animation:queuePulse .55s ease; }
      @keyframes rowHighlight{ from{ background:var(--ozkiz-pink-soft); } to{ background:transparent; } }
      .data-table tr.just-added{ animation:rowHighlight 1s ease; }
      @media (max-width:800px){
        .grid{grid-template-columns:1fr; grid-template-areas:"search" "queue" "log";}
        .queue-card #jobList{flex:none; max-height:520px;}
      }

      body.force-pc .grid{grid-template-columns:1.8fr 1fr !important; grid-template-areas:"search queue" "log queue" !important;}
      body.force-mobile .grid{grid-template-columns:1fr !important; grid-template-areas:"search" "queue" "log" !important;}
      body.force-mobile .queue-card #jobList{flex:none; max-height:520px;}
      body.force-mobile .card{padding:16px; border-radius:16px;}
      body.force-mobile input, body.force-mobile select, body.force-mobile button{font-size:16px; padding:14px;}
      body.force-mobile h2{font-size:17px;}
      body.force-mobile .small{font-size:13px;}
      .scan-card{display:none;}
      body.force-mobile .scan-card{display:block;}
      .scan-frame{position:relative; width:100%; max-width:220px; margin:0 auto;}
      #scanVideo{width:100%; border-radius:12px; background:#000; display:block;}
      #scanOverlay{position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;}
      .scan-actions{display:flex; gap:8px; margin-top:10px;}
      .scan-actions button{width:auto; flex:1;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <h1><span class="brand-mark">OH!</span> Barcode</h1>
          <span>상품명을 입력하면 Supabase의 상품 데이터에서 바코드를 찾아 바로 스티커 출력 요청을 보냅니다.</span>
        </div>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-bottom">
          <a class="side-link" href="https://cod-receipt-web.vercel.app/" target="_blank" rel="noopener noreferrer">
            <span class="side-link-mark">OH!</span> CRS
          </a>
          <a class="side-link" href="https://india-packing-web-cddc.vercel.app/?pc=1" target="_blank" rel="noopener noreferrer">
            <span class="side-link-mark">OH!</span> Packing
          </a>
          <a class="side-link" href="https://easyadmin-shipping-web.onrender.com/" target="_blank" rel="noopener noreferrer">
            <span class="side-link-mark">OH!</span> DMC
          </a>
          <div class="view-toggle">
            <button type="button" id="viewPcButton" class="view-btn">PC 버전</button>
            <button type="button" id="viewMobileButton" class="view-btn">모바일 버전</button>
          </div>
        </div>
      </aside>

      <main class="app-main">
        <div class="card scan-card">
          <h2>바코드 스캔</h2>
          <button id="startScanButton" type="button">카메라로 바코드 스캔</button>
          <div id="scanVideoWrap" style="display:none; margin-top:10px;">
            <div class="scan-frame">
              <video id="scanVideo" playsinline autoplay muted></video>
              <canvas id="scanOverlay"></canvas>
            </div>
            <div class="scan-actions">
              <button id="stopScanButton" class="ghost" type="button">스캔 중지</button>
            </div>
          </div>
          <p id="scanMessage" class="small"></p>
        </div>

        <div class="grid">
          <div class="card search-card">
            <div class="row">
              <h2>바코드 스티커 출력</h2>
              <div class="search-toolbar">
                <input id="productQuery" placeholder="상품명 또는 상품명 색상 사이즈" />
                <button id="searchButton" type="button">검색</button>
              </div>
            </div>
            <p id="searchMessage" class="small"></p>
            <div id="productResults"></div>
          </div>

          <div class="card log-card">
            <div class="row">
              <h2>출력 로그</h2>
              <div class="log-toolbar">
                <input type="date" id="logDateInput" />
                <button id="toggleLogsButton" class="ghost" type="button">접기</button>
                <button id="clearLogsButton" class="ghost" type="button">초기화</button>
              </div>
            </div>
            <div id="logList"></div>
          </div>

          <div class="card queue-card">
            <div class="row">
              <h2>출력 대기열</h2>
              <div class="queue-toolbar">
                <button id="deleteAllButton" class="ghost" type="button">초기화</button>
                <button id="printSelectedButton" class="secondary" type="button">선택 출력</button>
                <button id="printAllButton" class="secondary" type="button">전체 출력</button>
              </div>
            </div>
            <div id="jobList"></div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const searchInput = document.getElementById('productQuery');
      const searchButton = document.getElementById('searchButton');
      const searchMessage = document.getElementById('searchMessage');
      const productResults = document.getElementById('productResults');
      const jobList = document.getElementById('jobList');
      const logList = document.getElementById('logList');
      const printSelectedButton = document.getElementById('printSelectedButton');
      const printAllButton = document.getElementById('printAllButton');
      const deleteAllButton = document.getElementById('deleteAllButton');
      const startScanButton = document.getElementById('startScanButton');
      const stopScanButton = document.getElementById('stopScanButton');
      const scanVideoWrap = document.getElementById('scanVideoWrap');
      const scanVideo = document.getElementById('scanVideo');
      const scanOverlay = document.getElementById('scanOverlay');
      const scanMessage = document.getElementById('scanMessage');
      let barcodeReader = null;
      const viewPcButton = document.getElementById('viewPcButton');
      const viewMobileButton = document.getElementById('viewMobileButton');
      const toggleLogsButton = document.getElementById('toggleLogsButton');
      const clearLogsButton = document.getElementById('clearLogsButton');
      const logDateInput = document.getElementById('logDateInput');
      const state = { jobs: [], products: [], logs: [], searched: false, selectedJobs: new Set(), logsCollapsed: false, justAddedJobId: null };
      let justAddedTimer = null;

      function flyToQueue(sourceEl) {
        const queueCard = document.querySelector('.queue-card');
        if (!queueCard || !sourceEl.animate) return;
        const startRect = sourceEl.getBoundingClientRect();
        const endRect = queueCard.getBoundingClientRect();

        const dot = document.createElement('div');
        dot.className = 'fly-dot';
        const startX = startRect.left + startRect.width / 2 - 7;
        const startY = startRect.top + startRect.height / 2 - 7;
        dot.style.left = `${startX}px`;
        dot.style.top = `${startY}px`;
        document.body.appendChild(dot);

        const dx = (endRect.left + 36) - (startRect.left + startRect.width / 2);
        const dy = (endRect.top + 24) - (startRect.top + startRect.height / 2);

        const anim = dot.animate([
          { transform: 'translate(0px, 0px) scale(1)', opacity: 1 },
          { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 50}px) scale(0.75)`, opacity: 1, offset: 0.55 },
          { transform: `translate(${dx}px, ${dy}px) scale(0.15)`, opacity: 0 }
        ], { duration: 600, easing: 'cubic-bezier(.32,.64,.35,1)' });

        anim.onfinish = () => {
          dot.remove();
          queueCard.classList.add('pulse');
          setTimeout(() => queueCard.classList.remove('pulse'), 550);
        };
      }

      function getKstDateString(date) {
        const kst = new Date(date.getTime() + 9 * 60 * 60 * 1000);
        return kst.toISOString().slice(0, 10);
      }

      function addDaysToDateString(dateString, days) {
        const [y, m, d] = dateString.split('-').map(Number);
        const base = new Date(Date.UTC(y, m - 1, d));
        base.setUTCDate(base.getUTCDate() + days);
        return base.toISOString().slice(0, 10);
      }

      let lastKnownTodayKst = getKstDateString(new Date());

      function applyViewMode(mode) {
        const isMobile = mode === 'mobile';
        document.body.classList.toggle('force-mobile', isMobile);
        document.body.classList.toggle('force-pc', !isMobile);
        viewPcButton.classList.toggle('active', !isMobile);
        viewMobileButton.classList.toggle('active', isMobile);
        localStorage.setItem('viewMode', mode);
        if (!isMobile) stopScan();
      }

      viewPcButton.addEventListener('click', () => applyViewMode('pc'));
      viewMobileButton.addEventListener('click', () => applyViewMode('mobile'));

      async function refreshJobs() {
        const response = await fetch('/api/jobs');
        state.jobs = await response.json();
        renderJobs();
      }

      async function refreshLogs() {
        const currentTodayKst = getKstDateString(new Date());
        if (logDateInput.value === lastKnownTodayKst && currentTodayKst !== lastKnownTodayKst) {
          logDateInput.value = currentTodayKst;
          logDateInput.max = currentTodayKst;
          logDateInput.min = addDaysToDateString(currentTodayKst, -6);
        }
        lastKnownTodayKst = currentTodayKst;

        const response = await fetch(`/api/logs?date=${encodeURIComponent(logDateInput.value)}`);
        state.logs = await response.json();
        renderLogs();
      }

      function renderLogs() {
        if (!state.logs.length) {
          logList.innerHTML = '';
          return;
        }

        const rows = state.logs.map((log) => `
          <tr>
            <td class="name-cell nowrap">${log.barcode}</td>
            <td class="small wrap">${log.note || '-'}${log.option ? ` · ${log.option}` : ''}</td>
            <td><span class="job-status">출력 ${log.printCount || 1}회</span></td>
            <td class="small nowrap">${new Date(log.printedAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}</td>
            <td>
              <div class="row-actions">
                <button type="button" class="ghost" onclick="reprintLog('${log.id}')">재출력</button>
                <button type="button" class="ghost" onclick="deleteLog('${log.id}', this)">×</button>
              </div>
            </td>
          </tr>
        `).join('');

        logList.innerHTML = `
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>바코드</th><th>상품명 / 옵션</th><th>횟수</th><th>시간</th><th></th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }

      window.reprintLog = async function(logId) {
        const log = state.logs.find((item) => item.id === logId);
        if (!log) return;
        const job = { barcode: log.barcode, quantity: 1, note: log.note, sku: log.sku, option: log.option };
        const printWindow = window.open('', '_blank', 'width=960,height=680');
        printWindow.document.write(buildLabelHtml(job));
        printWindow.document.close();
        printWindow.onafterprint = () => printWindow.close();
        setTimeout(() => { printWindow.print(); }, 400);

        const response = await fetch('/api/logs', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: logId })
        });
        if (response.ok) {
          const data = await response.json();
          log.printCount = data.printCount;
          renderLogs();
        }
      };

      window.deleteLog = async function(logId, buttonEl) {
        const row = buttonEl ? buttonEl.closest('tr') : null;
        if (row && row.animate) {
          const anim = row.animate(
            [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(0.96)' }],
            { duration: 240, easing: 'ease-in', fill: 'forwards' }
          );
          await anim.finished.catch(() => {});
        }
        await fetch(`/api/logs?id=${encodeURIComponent(logId)}`, { method: 'DELETE' });
        state.logs = state.logs.filter((item) => item.id !== logId);
        renderLogs();
      };

      function statusLabel(status) {
        if (status === 'printing') return '출력중';
        if (status === 'pending') return '대기중';
        return status;
      }

      function renderJobs() {
        if (!state.jobs.length) {
          jobList.innerHTML = '';
          state.selectedJobs.clear();
          return;
        }

        const rows = state.jobs.map((job) => {
          const isSelected = state.selectedJobs.has(job.id);
          const isJustAdded = job.id === state.justAddedJobId;
          return `
          <tr class="${isJustAdded ? 'just-added' : ''}" style="background:${isSelected ? 'var(--ozkiz-pink-soft)' : 'transparent'};">
            <td><input type="checkbox" data-job-id="${job.id}" ${isSelected ? 'checked' : ''} /></td>
            <td class="name-cell nowrap">${job.barcode}</td>
            <td class="small wrap">${job.note || '-'}${job.option ? ` · ${job.option}` : ''}</td>
            <td>
              <div class="qty-row">
                <button type="button" class="qty-btn" data-action="dec" data-job-id="${job.id}">−</button>
                <input type="number" class="qty-input" data-job-id="${job.id}" value="${job.quantity}" min="1" inputmode="numeric" />
                <button type="button" class="qty-btn" data-action="inc" data-job-id="${job.id}">+</button>
              </div>
            </td>
            <td><span class="job-status">${statusLabel(job.status)}</span></td>
            <td>
              <div class="row-actions">
                <button type="button" onclick="printJob('${job.id}')">출력</button>
                <button type="button" class="ghost" onclick="deleteJob('${job.id}')">삭제</button>
              </div>
            </td>
          </tr>
        `;
        }).join('');

        const allSelected = state.jobs.length > 0 && state.selectedJobs.size === state.jobs.length;

        jobList.innerHTML = `
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th class="checkbox-col"><input type="checkbox" id="selectAllCheckbox" ${allSelected ? 'checked' : ''} /></th><th>바코드</th><th>상품명 / 옵션</th><th>수량</th><th>상태</th><th></th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }

      function updateJobQuantity(jobId, quantity) {
        const safeQuantity = Math.max(1, Math.floor(Number(quantity)) || 1);
        const job = state.jobs.find((item) => item.id === jobId);
        if (job) job.quantity = safeQuantity;
        renderJobs();
        fetch(`/api/jobs/${jobId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'setQuantity', quantity: safeQuantity })
        });
      }

      function renderProducts() {
        if (!state.searched || !state.products.length) {
          productResults.innerHTML = '';
          return;
        }

        const rows = state.products.map((product, index) => `
          <tr style="animation-delay:${Math.min(index, 20) * 22}ms;">
            <td class="name-cell">${product.name}</td>
            <td class="small wrap">${product.sku || '-'} · ${product.option || '-'}</td>
            <td class="small">${product.barcode || '바코드 없음'}</td>
            <td>
              <div class="row-actions">
                <button type="button" data-action="print" data-index="${index}" ${product.barcode ? '' : 'disabled'}>출력</button>
                <button class="ghost" type="button" data-action="add" data-index="${index}" ${product.barcode ? '' : 'disabled'} title="대기열에 추가">+</button>
              </div>
            </td>
          </tr>
        `).join('');

        productResults.innerHTML = `
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>상품명</th><th>SKU / 옵션</th><th>바코드</th><th></th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }

      async function searchProducts() {
        const query = searchInput.value.trim();
        state.searched = true;
        searchMessage.textContent = '';

        if (!query) {
          state.products = [];
          renderProducts();
          return;
        }

        const response = await fetch(`/api/products?query=${encodeURIComponent(query)}`);
        const data = await response.json();
        state.products = data.products || [];
        renderProducts();
      }

      async function addProductToQueue(product) {
        if (!product?.barcode) {
          searchMessage.textContent = '이 상품에는 바코드가 없어 대기열에 추가할 수 없습니다.';
          return;
        }

        const payload = {
          barcode: product.barcode,
          quantity: 1,
          note: product.name,
          sku: product.sku || '',
          option: product.option || '',
          source: /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 'mobile' : 'desktop'
        };

        const response = await fetch('/api/jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const job = await response.json();
        const existingIndex = state.jobs.findIndex((item) => item.id === job.id);
        if (existingIndex !== -1) {
          state.jobs[existingIndex] = job;
        } else {
          state.jobs.unshift(job);
        }
        searchMessage.textContent = `${product.name}이 대기열에 추가되었습니다.`;
        state.justAddedJobId = job.id;
        renderJobs();
        clearTimeout(justAddedTimer);
        justAddedTimer = setTimeout(() => { state.justAddedJobId = null; }, 900);
      }

      let cachedVoices = [];
      if ('speechSynthesis' in window) {
        const loadVoices = () => { cachedVoices = window.speechSynthesis.getVoices(); };
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }

      function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        try {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ko-KR';
          const koreanVoice = cachedVoices.find((v) => v.lang && v.lang.startsWith('ko'));
          if (koreanVoice) utterance.voice = koreanVoice;
          utterance.pitch = 1.4;
          utterance.rate = 0.9;
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(utterance);
        } catch (error) {
          // speech synthesis unavailable; ignore
        }
      }

      async function handleScannedBarcode(barcode) {
        scanMessage.textContent = `스캔됨: ${barcode} — 상품 조회 중...`;
        try {
          const response = await fetch(`/api/products?barcode=${encodeURIComponent(barcode)}`);
          const data = await response.json();
          const product = (data.products || [])[0];
          if (!product) {
            scanMessage.textContent = `일치하는 상품을 찾지 못했습니다: ${barcode}`;
            stopScan();
            return;
          }
          await addProductToQueue(product);
          scanMessage.textContent = `${product.name} (${product.option || '-'}) 대기열에 추가되었습니다.`;
          speakText('완료');
          stopScan();
        } catch (error) {
          scanMessage.textContent = '상품 조회 중 오류가 발생했습니다.';
          stopScan();
        }
      }

      let scanBusy = false;
      let scanStream = null;
      let nativeScanActive = false;

      function clearScanOverlay() {
        const ctx = scanOverlay.getContext('2d');
        ctx.clearRect(0, 0, scanOverlay.width, scanOverlay.height);
      }

      function drawScanOverlayAndPickTarget(barcodes, preferredValue) {
        const displayWidth = scanVideo.clientWidth;
        const displayHeight = scanVideo.clientHeight;
        if (scanOverlay.width !== displayWidth) scanOverlay.width = displayWidth;
        if (scanOverlay.height !== displayHeight) scanOverlay.height = displayHeight;

        const ctx = scanOverlay.getContext('2d');
        ctx.clearRect(0, 0, scanOverlay.width, scanOverlay.height);

        if (!barcodes.length || !scanVideo.videoWidth) return null;

        const scaleX = displayWidth / scanVideo.videoWidth;
        const scaleY = displayHeight / scanVideo.videoHeight;
        const centerX = scanVideo.videoWidth / 2;
        const centerY = scanVideo.videoHeight / 2;
        const maxEligibleDist = Math.min(scanVideo.videoWidth, scanVideo.videoHeight) * 0.18;

        let target = null;

        if (preferredValue) {
          const held = barcodes.find((b) => b.rawValue === preferredValue);
          if (held) {
            const box = held.boundingBox;
            const dist = Math.hypot((box.x + box.width / 2) - centerX, (box.y + box.height / 2) - centerY);
            if (dist <= maxEligibleDist * 1.6) target = held;
          }
        }

        if (!target) {
          let closestDist = Infinity;
          for (const barcode of barcodes) {
            const box = barcode.boundingBox;
            const dist = Math.hypot((box.x + box.width / 2) - centerX, (box.y + box.height / 2) - centerY);
            if (dist <= maxEligibleDist && dist < closestDist) {
              closestDist = dist;
              target = barcode;
            }
          }
        }

        barcodes.forEach((barcode) => {
          const box = barcode.boundingBox;
          const isTarget = barcode === target;
          ctx.strokeStyle = isTarget ? '#22c55e' : 'rgba(255,255,255,0.5)';
          ctx.lineWidth = isTarget ? 3 : 1.5;
          ctx.strokeRect(box.x * scaleX, box.y * scaleY, box.width * scaleX, box.height * scaleY);
        });

        return target;
      }

      function freezeOverlayWithCapture(target) {
        const displayWidth = scanOverlay.width;
        const displayHeight = scanOverlay.height;
        const ctx = scanOverlay.getContext('2d');
        ctx.clearRect(0, 0, displayWidth, displayHeight);
        ctx.drawImage(scanVideo, 0, 0, displayWidth, displayHeight);

        if (scanVideo.videoWidth) {
          const scaleX = displayWidth / scanVideo.videoWidth;
          const scaleY = displayHeight / scanVideo.videoHeight;
          const box = target.boundingBox;
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 4;
          ctx.strokeRect(box.x * scaleX, box.y * scaleY, box.width * scaleX, box.height * scaleY);
        }

        scanVideo.pause();
      }

      async function startNativeDetection() {
        let formats;
        try {
          const supported = await window.BarcodeDetector.getSupportedFormats();
          formats = ['code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'upc_e'].filter((f) => supported.includes(f));
        } catch (error) {
          formats = undefined;
        }
        const detector = new window.BarcodeDetector(formats && formats.length ? { formats } : undefined);
        nativeScanActive = true;

        const LOCK_DURATION_MS = 1000;
        const LOCK_GRACE_MS = 500;
        let lockValue = null;
        let lockStartedAt = 0;
        let lastSeenAt = 0;
        let lastTarget = null;

        const tick = async () => {
          if (!nativeScanActive) return;
          try {
            const barcodes = await detector.detect(scanVideo);
            const target = drawScanOverlayAndPickTarget(barcodes, lockValue);
            const now = Date.now();

            if (target) {
              if (lockValue !== target.rawValue) {
                lockValue = target.rawValue;
                lockStartedAt = now;
              }
              lastSeenAt = now;
              lastTarget = target;
            } else if (lockValue && now - lastSeenAt > LOCK_GRACE_MS) {
              lockValue = null;
              lastTarget = null;
            }

            if (lockValue) {
              const remainingMs = LOCK_DURATION_MS - (now - lockStartedAt);
              if (!scanBusy) {
                scanMessage.textContent = remainingMs > 0
                  ? `바코드 고정됨 — 위치가 다르면 옮겨주세요 (${Math.ceil(remainingMs / 1000)}초 후 스캔)`
                  : '스캔 중...';
              }
              if (remainingMs <= 0 && !scanBusy) {
                scanBusy = true;
                const finalValue = lockValue;
                const finalTarget = lastTarget;
                lockValue = null;
                lastTarget = null;
                scanMessage.textContent = '스캔 완료!';
                if (finalTarget) freezeOverlayWithCapture(finalTarget);
                await new Promise((resolve) => setTimeout(resolve, 350));
                await handleScannedBarcode(finalValue);
                return;
              }
            } else if (!scanBusy) {
              scanMessage.textContent = '가운데 초록 박스에 바코드를 맞춰주세요.';
            }
          } catch (error) {
            // ignore transient per-frame detection errors
          }
          if (nativeScanActive) requestAnimationFrame(tick);
        };
        tick();
      }

      async function startZXingDetection() {
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
          ZXing.BarcodeFormat.CODE_128,
          ZXing.BarcodeFormat.CODE_39,
          ZXing.BarcodeFormat.EAN_13,
          ZXing.BarcodeFormat.EAN_8,
          ZXing.BarcodeFormat.UPC_A
        ]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        barcodeReader = new ZXing.BrowserMultiFormatReader(hints, 150);

        let attempts = 0;
        await barcodeReader.decodeFromStream(scanStream, scanVideo, async (result) => {
          attempts += 1;
          if (!scanBusy) {
            scanMessage.textContent = `바코드를 카메라에 비춰주세요. (스캔 시도 ${attempts}회)`;
          }
          if (!result || scanBusy) return;
          scanBusy = true;
          await handleScannedBarcode(result.getText());
          setTimeout(() => { scanBusy = false; }, 1500);
        });
      }

      async function startScan() {
        if (barcodeReader || nativeScanActive) return;
        scanBusy = false;
        scanMessage.textContent = '카메라를 켜는 중...';
        scanVideoWrap.style.display = '';
        startScanButton.style.display = 'none';

        try {
          scanStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          });
          scanVideo.srcObject = scanStream;
          await scanVideo.play();

          if ('BarcodeDetector' in window) {
            await startNativeDetection();
          } else {
            await startZXingDetection();
          }
          scanMessage.textContent = '바코드를 카메라에 비춰주세요.';
        } catch (error) {
          scanMessage.textContent = '카메라를 사용할 수 없습니다: ' + error.message;
          stopScan();
        }
      }

      function stopScan() {
        nativeScanActive = false;
        if (barcodeReader) {
          barcodeReader.reset();
          barcodeReader = null;
        }
        if (scanStream) {
          scanStream.getTracks().forEach((track) => track.stop());
          scanStream = null;
        }
        scanVideo.srcObject = null;
        clearScanOverlay();
        scanVideoWrap.style.display = 'none';
        startScanButton.style.display = '';
      }

      async function printProductNow(product) {
        if (!product?.barcode) {
          searchMessage.textContent = '이 상품에는 바코드가 없어 출력할 수 없습니다.';
          return;
        }

        const payload = {
          barcode: product.barcode,
          quantity: 1,
          note: product.name,
          sku: product.sku || '',
          option: product.option || '',
          source: /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 'mobile' : 'desktop'
        };

        const response = await fetch('/api/jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const job = await response.json();
        await printJobModel(job, product);
        searchMessage.textContent = `${product.name} 바코드를 출력했습니다.`;
      }

      const LABEL_WIDTH_MM = 80;
      const LABEL_HEIGHT_MM = 40;

      function generateBarcodeSvg(code) {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = '<svg></svg>';
        const svg = wrapper.firstElementChild;
        JsBarcode(svg, String(code || '').trim(), {
          format: 'CODE128',
          displayValue: true,
          fontSize: 14,
          width: 2,
          height: 50,
          margin: 4,
          textMargin: 4
        });
        return wrapper.innerHTML;
      }

      function buildLabelBodyHtml(job, product) {
        const name = product?.name || job.note || job.barcode || '상품명 없음';
        const sku = product?.sku || job.sku || job.barcode || '';
        const option = product?.option || job.option || '-';
        const barcodeSvg = generateBarcodeSvg(job.barcode);
        return `
          <div class="label">
            <div class="field"><span class="field-label">제품명 :</span><span class="field-value">${name}</span></div>
            <div class="field"><span class="field-label">품 번 :</span><span class="field-value">${sku}</span></div>
            <div class="field"><span class="field-label">옵 션 :</span><span class="field-value">${option}</span></div>
            <div class="barcode-wrap">${barcodeSvg}</div>
          </div>
        `;
      }

      function buildLabelDocument(bodyHtml) {
        return `<!doctype html><html><head><meta charset="utf-8" /><title>Barcode Print</title><style>
          @page { size: ${LABEL_WIDTH_MM}mm ${LABEL_HEIGHT_MM}mm; margin: 0; }
          * { box-sizing: border-box; }
          html, body { margin:0; padding:0; font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; color:#111; background:#fff; }
          .label { width:${LABEL_WIDTH_MM}mm; height:${LABEL_HEIGHT_MM}mm; padding:2mm 3mm; display:flex; flex-direction:column; overflow:hidden; page-break-after:always; break-after:page; }
          .label:last-child { page-break-after:auto; break-after:auto; }
          .field { display:flex; align-items:baseline; font-size:11.5pt; line-height:1.55; white-space:nowrap; overflow:hidden; }
          .field .field-label { font-weight:800; flex:0 0 20mm; }
          .field .field-value { font-weight:500; flex:1; overflow:hidden; text-overflow:ellipsis; }
          .barcode-wrap { flex:1; display:flex; align-items:center; justify-content:center; margin-top:1mm; overflow:hidden; }
          .barcode-wrap svg { width:${LABEL_WIDTH_MM - 6}mm; height:15mm; }
        </style></head><body>${bodyHtml}</body></html>`;
      }

      function buildLabelHtml(job, product) {
        const quantity = Math.max(1, Math.floor(Number(job.quantity)) || 1);
        const bodyHtml = Array.from({ length: quantity }, () => buildLabelBodyHtml(job, product)).join('');
        return buildLabelDocument(bodyHtml);
      }

      function buildBatchLabelHtml(items) {
        const bodyHtml = items.flatMap(({ job, product }) => {
          const quantity = Math.max(1, Math.floor(Number(job.quantity)) || 1);
          return Array.from({ length: quantity }, () => buildLabelBodyHtml(job, product));
        }).join('');
        return buildLabelDocument(bodyHtml);
      }

      async function printLabelWindow(job, product) {
        await fetch(`/api/jobs/${job.id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'printing' }) });
        const printWindow = window.open('', '_blank', 'width=960,height=680');
        printWindow.document.write(buildLabelHtml(job, product));
        printWindow.document.close();
        printWindow.onafterprint = () => printWindow.close();
        setTimeout(() => { printWindow.print(); }, 400);
        await fetch(`/api/jobs/${job.id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'printed' }) });
      }

      async function printJobModel(job, product) {
        if (!job) return;
        await printLabelWindow(job, product);
        await refreshJobs();
        await refreshLogs();
      }

      async function printJobsBatch(jobsToPrint) {
        if (!jobsToPrint.length) return;

        await Promise.all(jobsToPrint.map((job) =>
          fetch(`/api/jobs/${job.id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'printing' }) })
        ));

        const items = jobsToPrint.map((job) => ({
          job,
          product: state.products.find((item) => item.barcode === job.barcode) || { name: job.note, sku: job.sku, option: job.option }
        }));

        const printWindow = window.open('', '_blank', 'width=960,height=680');
        printWindow.document.write(buildBatchLabelHtml(items));
        printWindow.document.close();
        printWindow.onafterprint = () => printWindow.close();
        setTimeout(() => { printWindow.print(); }, 400);

        await Promise.all(jobsToPrint.map((job) =>
          fetch(`/api/jobs/${job.id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'printed' }) })
        ));

        await refreshJobs();
        await refreshLogs();
      }

      async function deleteJob(jobId) {
        await fetch(`/api/jobs/${jobId}`, { method: 'DELETE' });
        state.selectedJobs.delete(jobId);
        await refreshJobs();
      }

      window.printJob = async function(jobId) {
        const job = state.jobs.find((item) => item.id === jobId);
        if (!job) return;
        const product = state.products.find((item) => item.barcode === job.barcode) || { name: job.note, sku: job.sku, option: job.option };
        await printLabelWindow(job, product);
        await refreshJobs();
        await refreshLogs();
      };

      searchButton.addEventListener('click', searchProducts);
      searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          searchProducts();
        }
      });

      productResults.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-index]');
        if (!button) return;
        const index = Number(button.getAttribute('data-index'));
        const product = state.products[index];
        if (!product) return;
        if (button.getAttribute('data-action') === 'print') {
          await printProductNow(product);
        } else {
          flyToQueue(button);
          await addProductToQueue(product);
        }
      });

      printSelectedButton.addEventListener('click', async () => {
        const selected = state.jobs.filter((job) => state.selectedJobs.has(job.id));
        if (!selected.length) {
          searchMessage.textContent = '선택된 항목이 없습니다.';
          return;
        }
        await printJobsBatch(selected);
      });

      printAllButton.addEventListener('click', async () => {
        if (!state.jobs.length) {
          searchMessage.textContent = '대기열에 항목이 없습니다.';
          return;
        }
        await printJobsBatch(state.jobs.slice());
      });

      deleteAllButton.addEventListener('click', async () => {
        if (!state.jobs.length) {
          searchMessage.textContent = '대기열에 항목이 없습니다.';
          return;
        }
        if (!window.confirm(`대기열 전체(${state.jobs.length}개)를 삭제할까요?`)) return;
        await Promise.all(state.jobs.map((job) => fetch(`/api/jobs/${job.id}`, { method: 'DELETE' })));
        state.selectedJobs.clear();
        await refreshJobs();
      });

      startScanButton.addEventListener('click', startScan);
      stopScanButton.addEventListener('click', stopScan);

      jobList.addEventListener('change', (event) => {
        if (event.target.id === 'selectAllCheckbox') {
          state.selectedJobs = event.target.checked
            ? new Set(state.jobs.map((job) => job.id))
            : new Set();
          renderJobs();
          return;
        }

        const checkbox = event.target.closest('input[type="checkbox"][data-job-id]');
        if (!checkbox) return;
        const jobId = checkbox.getAttribute('data-job-id');
        if (checkbox.checked) {
          state.selectedJobs.add(jobId);
        } else {
          state.selectedJobs.delete(jobId);
        }
        renderJobs();
      });

      jobList.addEventListener('click', (event) => {
        const button = event.target.closest('button.qty-btn[data-job-id]');
        if (!button) return;
        const jobId = button.getAttribute('data-job-id');
        const job = state.jobs.find((item) => item.id === jobId);
        if (!job) return;
        const action = button.getAttribute('data-action');
        const nextQuantity = action === 'inc' ? job.quantity + 1 : job.quantity - 1;
        updateJobQuantity(jobId, nextQuantity);
      });

      jobList.addEventListener('change', (event) => {
        const input = event.target.closest('input.qty-input[data-job-id]');
        if (!input) return;
        const jobId = input.getAttribute('data-job-id');
        updateJobQuantity(jobId, input.value);
      });

      toggleLogsButton.addEventListener('click', () => {
        state.logsCollapsed = !state.logsCollapsed;
        toggleLogsButton.textContent = state.logsCollapsed ? '펼치기' : '접기';
        logList.style.display = state.logsCollapsed ? 'none' : '';
      });

      clearLogsButton.addEventListener('click', async () => {
        if (!state.logs.length) return;
        if (!window.confirm('출력 로그를 모두 삭제할까요? 이 작업은 되돌릴 수 없습니다.')) return;
        await fetch('/api/logs', { method: 'DELETE' });
        state.logs = [];
        renderLogs();
      });

      logDateInput.value = lastKnownTodayKst;
      logDateInput.max = lastKnownTodayKst;
      logDateInput.min = addDaysToDateString(lastKnownTodayKst, -6);
      logDateInput.addEventListener('change', () => {
        refreshLogs();
      });

      const savedViewMode = localStorage.getItem('viewMode');
      const initialViewMode = savedViewMode || (window.matchMedia('(max-width:800px)').matches ? 'mobile' : 'pc');
      applyViewMode(initialViewMode);

      refreshJobs();
      refreshLogs();
      renderProducts();
      setInterval(() => {
        refreshJobs();
        refreshLogs();
      }, 3000);
    </script>
  </body>
</html>
